[project]
name = "jarvis"
version = "0.1.0-rc1"
description = "Personal AI assistant, OpenClaw architecture (Python port)"
readme = "readme.md"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
requires-python = ">=3.12"
keywords = ["ai", "assistant", "jarvis", "openclaw", "plugin-sdk", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime deps live in member apps/packages/extensions. Root has none.
dependencies = []

[project.urls]
Homepage = "https://github.com/jarvis-ai/jarvis"
Documentation = "https://github.com/jarvis-ai/jarvis/tree/main/docs"
Repository = "https://github.com/jarvis-ai/jarvis.git"
Issues = "https://github.com/jarvis-ai/jarvis/issues"

# ─────────────────────────────────────────────────────────────────────
# OpenClaw-style schema versioning (single source of truth)
# Bump rules: state/agent/config/memory only when older readers cannot tolerate.
# ─────────────────────────────────────────────────────────────────────
[tool.jarvis]
# Schema versions — bump when older readers cannot tolerate new shape.
schema_state = 1
schema_agent = 1
schema_config = 1
schema_memory = 1
# Entrypoints per app (jarvis_desktop.app:main, jarvis_cli.app:main).
entrypoint_desktop = "jarvis_desktop.app:main"
entrypoint_cli = "jarvis_cli.app:main"
default_gateway_port = 7433

# ─────────────────────────────────────────────────────────────────────
# uv workspace — apps/, packages/, extensions/ are all workspace members.
# OpenClaw uses pnpm-workspace; this is the Python/uv equivalent.
# ─────────────────────────────────────────────────────────────────────
[tool.uv]
managed = true

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*",
    "extensions/*",
]

[tool.uv.sources]
jarvis-plugin-sdk = { workspace = true }
jarvis-memory-host-sdk = { workspace = true }
jarvis-normalization-core = { workspace = true }
jarvis-retry = { workspace = true }
jarvis-llm-client = { workspace = true }
jarvis-agent-runtime = { workspace = true }
jarvis = { workspace = true }

# Modern dependency groups (PEP 735). Replaces deprecated [tool.uv.dev-dependencies].
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.370",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.110.0",
    "pre-commit>=4.0.0",
]

# ─────────────────────────────────────────────────────────────────────
# Ruff — replaces ESLint+oxlint from OpenClaw. Lint + format in one tool.
# Rules calibrated for the JARVIS codebase: strict on correctness,
# lenient on style (formatter handles it).
# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "openclaw-main",     # upstream reference, do not lint
    "**/legacy_*",       # transitional code, removed per migration plan
    # TRANSITIONAL (PR 0.4/0.5): legacy root-level code that will be
    # refactored into proper packages in Phase 1+ (see
    # OPENCLAW_MIGRATION_PLAN.md §5). Removed from exclude list as
    # each module is migrated.
    "actions",
    "agent",
    "memory",
    "core",
    "or_client.py",
    "config",
    # Moved legacy app.py + ui.py (still monolithic, will split in Phase 1).
    "apps/desktop/src/jarvis_desktop/app.py",
    "apps/desktop/src/jarvis_desktop/ui.py",
]

[tool.ruff.lint]
# Selected rule families (mirrors OpenClaw's oxlint rule selection but for Python).
select = [
    "E", "W",   # pycodestyle errors + warnings
    "F",        # pyflakes
    "I",        # isort (imports)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit (security)
    "TCH",      # flake8-type-checking
    "PIE",      # flake8-pie
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "PL",       # pylint
    "TID",      # flake8-tidy-imports
]
ignore = [
    "E501",     # line length — handled by formatter
    "PLR0913",  # too many arguments — common in dataclasses
    "PLR2004",  # magic value — useful in tests
    "S101",     # assert — required for pytest
    "B008",     # function call in default argument — required for pydantic
    "N818",     # exception name ending in Error — keep our naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S603", "PLR2004", "N802"]
"**/legacy_*/*.py" = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL"]  # frozen legacy
"**/__init__.py" = ["F401"]  # re-exports allowed
# OpenClaw-parity files: preserve the structural patterns from the
# TS source (long functions, deep nesting, broad try/except, etc.).
# These ports mirror the OpenClaw code shape; aggressive refactoring
# would defeat the "same-to-same" goal.
"packages/plugin_sdk/src/jarvis_sdk/memory_host_*.py" = [
    "PLR0912",  # too many branches (mirrors OpenClaw's per-field ladder)
    "PLR0915",  # too many statements (mirrors long port functions)
    "C416",     # unnecessary-comprehension (intentional for parity)
    "SIM102",   # nested-if (mirrors OpenClaw's nested-if style)
    "SIM103",   # return-in-condition (intentional for parity)
    "SIM105",   # contextlib-suppress (intentional for parity)
    "SIM108",   # ternary (intentional for parity)
    "TRY003",   # long-message-outside-exception-class
    "BLE001",   # blind-except (intentional — OpenClaw catch-all)
    "EM101",    # exception-in-str (intentional for raise messages)
    "EM102",    # exception-in-fstring (intentional for raise messages)
    "N815",     # mixedCase (camelCase fields mirror OpenClaw JSON)
    "N818",     # exception-name (intentional for parity)
    "PERF203",  # try-except-in-loop (intentional for retry loops)
    "B904",     # raise-without-from-inside-except (intentional for parity)
    "B006",     # mutable-default-argument (intentional for callable defaults)
    "ARG001",   # unused-function-argument (intentional for protocol parity)
    "ARG002",   # unused-method-argument (intentional for protocol parity)
    "S110",     # try-except-pass (intentional for OSError cleanup)
]
"tools/**/*.py" = ["T201", "PLR0912"]   # print allowed in scripts; many branches in validators
# Phase 5.7 llm-core port: OpenClaw parity. These files mirror the shape of
# `packages/llm-core/src/*.ts`, where the long type-dispatch ladders and the
# deliberately-broad excepts *are* the design. Refactoring them would defeat
# the "same-to-same" goal, and in stream.py the broad except is the contract.
"packages/llm_client/src/jarvis_llm/types.py" = [
    "TCH003",   # typing-only stdlib import (dataclass fields need runtime types)
    "UP038",    # isinstance tuple vs union (parity with TS typeof chains)
]
"packages/llm_client/src/jarvis_llm/validation.py" = [
    "PLR0911",  # too many returns (mirrors the TS switch on schema type)
    "PLR0912",  # too many branches (same)
    "PLR0915",  # too many statements (same)
    "SIM102",   # nested-if (mirrors OpenClaw's nested-if style)
    "SIM103",   # return-in-condition (intentional for parity)
    "SIM108",   # ternary (intentional for parity)
    "SIM114",   # combine-if-branches (branches kept 1:1 with the TS cases)
    "UP038",    # isinstance tuple vs union (parity with TS typeof chains)
    "TCH003",
]
"packages/llm_client/src/jarvis_llm/stream.py" = [
    "BLE001",   # blind-except IS the never-throw contract, not an oversight
    "TCH003",
]
"packages/llm_client/src/jarvis_llm/abort.py" = [
    "BLE001",   # best-effort teardown listeners must not break each other
    "S110",     # try-except-pass (same: abort path must not raise)
    "SLF001",   # private-member-access (controller owns its signal's listeners)
]
"packages/llm_client/src/jarvis_llm/event_stream.py" = [
    "ASYNC",    # __aiter__ as an async generator mirrors the TS iterator
    "TCH003",
]
# Phase 4.4 dreaming port: OpenClaw parity — these rules are unavoidable
# in deterministic helpers that mirror the TypeScript source structure.
"extensions/memory_core/dreaming_state.py" = ["PLR0912", "PLR0915", "C416", "PLW0603", "TCH003", "UP038"]
"extensions/memory_core/dreaming_shared.py" = ["PLR0912", "C416", "TCH003", "UP038"]
"extensions/memory_core/dreaming_events.py" = ["PLR0912", "C416", "TCH003", "UP038"]
"extensions/memory_core/time.py" = ["C416"]
"extensions/memory_core/dreaming_dreams_file.py" = ["PLR0912", "PLR0915", "C416", "SIM102", "SIM103", "SIM105", "TCH003", "UP038"]
"extensions/memory_core/dreaming_markdown.py" = ["PLR0912", "PLR0915", "C416", "SIM102", "SIM105", "ASYNC230", "TCH003", "UP038"]
"extensions/memory_core/dreaming_narrative.py" = ["PLR0912", "PLR0915", "C416", "SIM103", "PIE810", "N803", "S324", "S110", "TCH003", "UP038", "PTH", "RUF012", "RET504"]
"extensions/memory_core/dreaming_repair.py" = ["PLR0912", "PLR0915", "C416", "S110", "TCH003", "UP038"]
"extensions/memory_core/dreaming_shadow_trial.py" = ["PLR0912", "C416", "SIM105", "TCH003", "UP038", "RUF012"]
"extensions/memory_core/dreaming_phases.py" = ["S324", "PLR0912", "C416", "N803", "PLR0915", "PIE810", "RUF005", "UP038", "TCH003"]
"extensions/memory_core/dreaming_command.py" = ["S105", "SIM102", "S110", "PLR0912"]
"extensions/memory_core/dreaming.py" = ["PLR0912", "C416", "TCH003", "UP038"]
"extensions/memory_core/cli.py" = ["PLR0912", "C416", "TCH003", "UP038", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis_sdk", "jarvis_llm", "jarvis_desktop", "jarvis_cli"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─────────────────────────────────────────────────────────────────────
# Pyright — Python equivalent of OpenClaw's `tsgo` strict mode.
# ─────────────────────────────────────────────────────────────────────
[tool.pyright]
include = [
    "apps",
    "packages",
    "extensions",
    "tools",
    "tests",
    "examples",
]
exclude = [
    "**/legacy_*",
    "openclaw-main",
    ".venv",
    "build",
    "dist",
    # TRANSITIONAL (PR 0.4/0.5): legacy root-level code being migrated.
    # Removed from exclude list as each module is migrated to a proper package.
    "actions",
    "agent",
    "memory",
    "core",
    "or_client.py",
    "config",
    # Moved legacy app.py + ui.py (monolithic; splits in Phase 1).
    "apps/desktop/src/jarvis_desktop/app.py",
    "apps/desktop/src/jarvis_desktop/ui.py",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = "false"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportAttributeAccessIssue = "warning"
reportTypedDictNotRequiredAccess = "warning"

# ─────────────────────────────────────────────────────────────────────
# Pytest — equivalent of OpenClaw's vitest. hypothesis for property tests.
# ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps", "packages", "extensions", "tools", "tests"]
pythonpath = [
    ".",
    "src",
    "packages/plugin_sdk/src",
    "packages/memory_host_sdk/src",
    "packages/normalization_core/src",
    "packages/retry/src",
    "packages/llm_client/src",
    "apps/desktop/src",
    "apps/cli/src",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--import-mode=importlib",
]
filterwarnings = [
    # Catch-all: any other warning is an error.
    "error",
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore::DeprecationWarning:hypothesis",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestWarning",
    # TRANSITIONAL (PR 0.4): legacy actions/file_processor.py still imports
    # the deprecated `google.generativeai` package, which raises
    # FutureWarning at import time. The demotion filter MUST be the last
    # entry in this list because warnings.filterwarnings() inserts each
    # filter at the FRONT of Python's filter list, so the last entry here
    # is the first to match. Demote FutureWarning globally to default
    # until Phase 2 refactors file_processor. Removed in Phase 2.
    "default::FutureWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration (require external services)",
    "e2e: marks tests as end-to-end (full system)",
    "contract: marks tests as plugin contract tests",
]

# ─────────────────────────────────────────────────────────────────────
# Coverage — replaced OpenClaw's vitest coverage; same thresholds.
# ─────────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["apps", "packages", "extensions"]
omit = [
    "**/legacy_*",
    "**/__init__.py",
    "**/test_*",
    "openclaw-main/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

# ─────────────────────────────────────────────────────────────────────
# Hypothesis — property-based testing (Python's vitest-quickcheck equivalent).
# ─────────────────────────────────────────────────────────────────────
[tool.hypothesis]
max_examples = 100
derandomize = true
print_blob = false
# `deadline` intentionally unset: defaults are fine. Override per-test with
# `@settings(deadline=...)` when needed.
