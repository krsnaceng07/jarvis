# extensions/tool_reminder — JARVIS reminder tool (Phase 1B)
#
# This file exists only to satisfy uv's workspace pattern (`extensions/*`
# in pyproject.toml's `[tool.uv.workspace] members`). It is NOT a buildable
# Python package — the plugin is loaded by the host via direct import
# (`from extensions.tool_reminder import entry`).
#
# `[tool.uv] package = false` tells uv to skip wheel-building for this dir.

[project]
name = "jarvis-tool-reminder"
version = "0.1.0"
description = "JARVIS reminder tool — sets timed reminders via Windows Task Scheduler (Phase 1B: Windows-only)."
requires-python = ">=3.13"

[tool.uv]
package = false
