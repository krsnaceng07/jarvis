# extensions/tool_weather — Phase 1A proof consumer
#
# This file exists only to satisfy uv's workspace pattern (`extensions/*`
# in pyproject.toml's `[tool.uv.workspace] members`). It is NOT a buildable
# Python package — the plugin is loaded by the host via direct import
# (`from extensions.tool_weather.plugin import WeatherPlugin`).
#
# `[tool.uv] package = false` tells uv to skip wheel-building for this dir.
# Real extension builds (with their own deps) land in Phase 2/3+ if/when
# an extension needs to be installable as a standalone package.

[project]
name = "jarvis-tool-weather"
version = "0.1.0"
description = "JARVIS weather tool — opens Google weather search in the browser."
requires-python = ">=3.13"

[tool.uv]
package = false
