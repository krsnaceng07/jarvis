[project]
name = "jarvis-learning"
version = "0.1.0"
description = "Learning plugin for JARVIS — hooks learning engine into the runtime"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jarvis-learning-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["plugin.py", "jarvis.plugin.json"]

[tool.uv.sources]
jarvis-learning-core = { workspace = true }
