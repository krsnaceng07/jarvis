[project]
name = "jarvis-cli"
version = "0.1.0"
description = "JARVIS CLI — headless gateway for tools/skills/doctor/memory/cron/hooks. Mirrors OpenClaw's `openclaw` command tree."
requires-python = ">=3.13"
dependencies = [
    "jarvis-plugin-sdk",
]

[project.scripts]
jarvis = "jarvis_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_cli"]

[tool.uv]
package = true
