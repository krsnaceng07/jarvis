[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-sdk"
version = "0.1.0"
description = "JARVIS client SDK — portable programmatic access for external clients"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_sdk"]
