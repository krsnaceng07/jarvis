[project]
name = "jarvis-channels-core"
version = "0.1.0"
description = "JARVIS channels core — transport contracts and channel routing (OpenClaw parity)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "jarvis-plugin-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_channels"]

[tool.uv.sources]
jarvis-plugin-sdk = { workspace = true }
