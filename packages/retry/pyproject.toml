# packages/retry — async retry with backoff
#
# Mirrors OpenClaw's `packages/retry/` (the `retryAsync` helper
# used by every I/O path). JARVIS ports:
# - `retryAsync` → `jarvis_sdk.retry_runtime.retry_async`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-retry"
version = "0.1.0-rc1"
description = "JARVIS Retry — async retry with bounded attempts + linear backoff."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
keywords = ["jarvis", "retry", "openclaw", "backoff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/jarvis-ai/jarvis"
Repository = "https://github.com/jarvis-ai/jarvis.git"
Issues = "https://github.com/jarvis-ai/jarvis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_retry"]

[tool.hatch.build.targets.sdist]
include = ["src/jarvis_retry", "README.md", "AGENTS.md"]
