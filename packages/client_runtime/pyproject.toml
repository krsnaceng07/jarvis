[project]
name = "jarvis-client-runtime"
version = "0.1.0"
description = "JARVIS client runtime — unified SDK for Desktop, Web, and CLI clients"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "jarvis-gateway-protocol",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_client"]

[tool.uv.sources]
jarvis-gateway-protocol = { workspace = true }
