[project]
name = "jarvis-hooks-core"
version = "0.1.0"
description = "JARVIS hooks core — in-process plugin event bus (OpenClaw parity)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "jarvis-plugin-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_hooks"]

[tool.uv.sources]
jarvis-plugin-sdk = { workspace = true }
