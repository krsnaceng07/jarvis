[project]
name = "jarvis-state-core"
version = "0.1.0"
description = "Canonical SQLite state database for the JARVIS Brain Core (state_core package)"
requires-python = ">=3.12"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_state_core"]
