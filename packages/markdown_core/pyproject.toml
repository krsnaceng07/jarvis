[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-markdown-core"
version = "0.1.0"
description = "Markdown IR parsing, chunking, sanitization, and presentation rendering"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_markdown_core"]
