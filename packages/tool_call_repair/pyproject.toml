# packages/tool_call_repair — model-emitted plain-text tool-call repair
#
# Mirrors OpenClaw's `packages/tool-call-repair/` (grammar, payload,
# promote, protection-fast-path). The streaming normalizer lands as a
# follow-up slice; this package ships the deterministic core.
# stdlib-only plus jarvis-normalization-core.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-tool-call-repair"
version = "0.1.0-rc1"
description = "JARVIS tool-call repair — plain-text tool-call grammar, payload parsing, promotion (OpenClaw tool-call-repair parity)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
keywords = ["jarvis", "tool-call", "openclaw"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "jarvis-normalization-core>=0.1.0-rc1",
]

[project.urls]
Homepage = "https://github.com/jarvis-ai/jarvis"
Repository = "https://github.com/jarvis-ai/jarvis.git"
Issues = "https://github.com/jarvis-ai/jarvis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_tool_call_repair"]

[tool.hatch.build.targets.sdist]
include = ["src/jarvis_tool_call_repair", "README.md"]
