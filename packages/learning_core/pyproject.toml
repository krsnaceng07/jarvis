[project]
name = "jarvis-learning-core"
version = "0.1.0"
description = "Self-learning and continual-learning engine for JARVIS"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
training = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "sentencepiece>=0.1.99",
    "datasets>=2.18",
    "tiktoken>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_learning"]
