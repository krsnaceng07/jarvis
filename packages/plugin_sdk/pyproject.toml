# packages/plugin_sdk — JARVIS Plugin SDK (the contract)
#
# Mirrors OpenClaw's `src/plugin-sdk/` (which itself is a thin re-export
# facade over `packages/plugin-sdk/*` in OpenClaw's full codebase).
# Plugins import ONLY from this package; never from `src/...` or
# other extensions.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-plugin-sdk"
version = "0.1.0-rc1"
description = "JARVIS Plugin SDK — the contract all extensions import from."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
keywords = ["jarvis", "plugin-sdk", "openclaw", "extension", "contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No runtime deps. The SDK is stdlib-only (dataclasses, abc, typing).
# Optional deps (pydantic for schema validation, etc.) land in Phase 1C
# when the contract hardens.

[project.urls]
Homepage = "https://github.com/jarvis-ai/jarvis"
Repository = "https://github.com/jarvis-ai/jarvis.git"
Issues = "https://github.com/jarvis-ai/jarvis/issues"

# ─────────────────────────────────────────────────────────────────────
# Build configuration (hatchling + src layout)
# ─────────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/jarvis_sdk", "README.md", "AGENTS.md"]
