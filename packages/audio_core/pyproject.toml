[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-audio-core"
version = "0.1.0"
description = "Audio device management, real-time streaming, and capture pipeline"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_audio_core"]
