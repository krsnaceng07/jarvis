[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-mermaid-renderer"
version = "0.1.0"
description = "Mermaid diagram validation, sanitization, and SVG rendering"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JARVIS architect" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_mermaid_renderer"]
