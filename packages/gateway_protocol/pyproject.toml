[project]
name = "jarvis-gateway-protocol"
version = "0.1.0"
description = "JARVIS gateway protocol — JSON-RPC schema for gateway ↔ client communication"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_gateway_protocol"]
